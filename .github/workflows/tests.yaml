name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  run_tests_ubuntu:
    runs-on: ubuntu-latest

    # Hoisted so the Codecov steps can test for its presence: the `secrets`
    # context is not available in a step-level `if:`, but `env` is.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    strategy:
      fail-fast: false

    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Setup package
        uses: ./.github/actions/setup
        with:
          python-version: "3.12"

      - name: Run tests
        run: >
          uv run pytest -v
          --ignore=docs
          --cov=src
          --cov-report=xml:coverage.xml
          --cov-report=term
          --junitxml=junit.xml

      # Skip Codecov unless a token is actually configured. Two cases have no
      # token: Dependabot runs, which deliberately cannot read repository
      # secrets, and a repository where Codecov has not been set up yet. In
      # both, a tokenless upload fails with HTTP 400 and -- because
      # `fail_ci_if_error` is on -- would redden an otherwise passing run.
      # Add CODECOV_TOKEN in the repository settings to turn these back on.
      - name: Upload coverage to Codecov
        if: github.actor != 'dependabot[bot]' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' && env.CODECOV_TOKEN != '' }}
        uses: codecov/test-results-action@v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
