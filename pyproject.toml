[build-system]
requires = ["setuptools>=80.9.0", "setuptools-scm>=9.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-scaling-laws"
dynamic = ["version"] # Makes setuptools-scm manage the version
authors = [
  {name="Matthew McDermott", email="mattmcdermott8@gmail.com"},
]
description = "Fit empirical ML scaling laws, with conservative uncertainty, from repeated training/evaluation records."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.13",
  "polars>=1.0",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pre-commit", "pytest", "pytest-cov", "pretty-print-directory", "hypothesis>=6.100",
  # Keep this pin in sync with the `ruff-pre-commit` rev in
  # .pre-commit-config.yaml. If the two drift, `uv run ruff format` and the
  # pre-commit hook can disagree and fight over the same files.
  "ruff==0.16.5",
  # shfmt-py bundles the `shfmt` binary used by the mdformat-shfmt pre-commit
  # hook. Pinning it here (in addition to the pre-commit hook's
  # additional_dependencies) gives a single source of truth and keeps local
  # `uv run mdformat ...` runs consistent with CI pre-commit runs.
  "shfmt-py==3.12.0.2",
]
docs = []

[tool.setuptools_scm] # Required for setuptools-scm to work, even if empty

[project.optional-dependencies]

[project.scripts]
scaling-laws = "simple_scaling_laws.cli:main"

[tool.pytest.ini_options] # Default pytest options
addopts = [
  "--color=yes",
  "--doctest-modules", # Ensures that doctest runs
  "--ignore=docs",
  "--ignore=AGENTS.md",
  "--ignore=CONTRIBUTORS.md",
  "--doctest-glob=*.md",
  "--doctest-continue-on-failure",
]
markers = []
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[project.urls]
Homepage = "https://github.com/mmcdermott/simple-scaling-laws"
Issues = "https://github.com/mmcdermott/simple-scaling-laws/issues"

[tool.ruff] # Ruff configuration for linting and formatting
target-version = "py312"
line-length = 110
extend-exclude = ["docs/index.md"]

# Enable linters
[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "N",   # pep8-naming
    "D",   # docstring-checker
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__ files
"test_*" = ["DTZ001"]  # Ignore datetimez in test files
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]  # Docstrings not required in test files

[tool.ruff.lint.pep8-naming]
# Scaling-law parameters are conventionally capital letters (E, A, B) and Greek
# letters spelled out; N and D are model/dataset size. Allow them as names.
extend-ignore-names = ["*MEDS*", "*NRT*", "D", "L", "N", "E", "A", "B", "X", "J", "W", "Y"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["simple_scaling_laws"]
